[project]
name = "trading-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "pandas>=2.2",
    "pandas-ta>=0.3.14b",
    "httpx>=0.27",
    "websockets>=12",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "apscheduler>=3.10",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiolimiter>=1.1",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "kis",
    "data",
    "strategy",
    "risk",
    "execution",
    "backtesting",
    "repository",
    "core",
    "scripts",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
