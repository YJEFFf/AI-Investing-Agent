# 워치리스트 설정
# 초기에는 수동 고정, 안정화 후 auto_select: true로 전환

mode: manual  # manual | auto

# 수동 종목 목록 (백테스트 통과: Sharpe ≥ 1.0, MDD ≤ 15%)
stocks:
  - code: "005930"
    name: "삼성전자"
  - code: "000660"
    name: "SK하이닉스"
  - code: "005380"
    name: "현대차"
  - code: "005490"
    name: "POSCO홀딩스"

# 자동 선정 조건 (mode: auto일 때 사용)
auto_select:
  max_stocks: 20
  min_market_cap_billion: 500    # 시가총액 500억 이상
  min_daily_volume_billion: 10   # 일평균 거래대금 10억 이상
  price_filter: dynamic          # 잔고 기반 동적 필터
